services:
  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: activemq-amqp
    ports:
      - "5672:5672"   # AMQP 1.0
      - "8161:8161"   # Console Web (artemis / artemis)
    environment:
      - AMQ_USER=artemis
      - AMQ_PASSWORD=artemis
      - AMQ_EXTRA_ARGS=--relax-jolokia